name: Google Shopping Feed

# Regenerates the Google feed on a schedule and deploys it to GitHub Pages.
# Google Merchant Center then fetches it from the Pages URL.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate DK feed (main store)
        env:
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_API_VERSION: "2025-10"
          STORE_URL: ${{ vars.STORE_URL }}
          FEED_CURRENCY: ${{ vars.FEED_CURRENCY }}
          OUTPUT_PATH: _site/google_feed.xml
        run: python3 feed_google.py

      - name: Generate Worldwide feed
        env:
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN_WW }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN_WW }}
          SHOPIFY_API_VERSION: "2025-10"
          STORE_URL: ${{ vars.STORE_URL_WW }}
          FEED_CURRENCY: ${{ vars.FEED_CURRENCY_WW }}
          OUTPUT_PATH: _site/google_feed_ww.xml
        run: |
          python3 feed_google.py
          # tiny landing page so the Pages root isn't a 404
          printf '<!doctype html><meta charset="utf-8"><title>AYA-S feeds</title><p>Google feeds:</p><ul><li><a href="google_feed.xml">google_feed.xml</a> (DK / DKK)</li><li><a href="google_feed_ww.xml">google_feed_ww.xml</a> (Worldwide / EUR)</li><li><a href="google_reviews.xml">google_reviews.xml</a> (Product reviews, DK)</li></ul>' > _site/index.html

      - name: Generate product reviews feed (Judge.me -> Google)
        env:
          JUDGEME_PRIVATE_TOKEN: ${{ secrets.JUDGEME_PRIVATE_TOKEN }}
          JUDGEME_SHOP_DOMAIN: ${{ secrets.JUDGEME_SHOP_DOMAIN }}
          STORE_URL: ${{ vars.STORE_URL }}
          REVIEWS_OUTPUT_PATH: _site/google_reviews.xml
        run: python3 reviews_google.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
